<!DOCTYPE html>
<!-- ΣΧΟΛΕΙΟ 360° — © by Chronis Makris -->
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="author" content="Chronis Makris">
<meta name="copyright" content="© by Chronis Makris">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ΣΧΟΛΕΙΟ 360°</title>
<!-- PWA: εγκατάσταση ως εφαρμογή στο κινητό (λειτουργεί όταν σερβίρεται μέσω http/https/localhost) -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2f8fd8">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ΣΧΟΛΕΙΟ 360°">
<style>
:root{
  --bg:#0e0f13; --bg2:#15171d; --panel:#1b1e26; --panel2:#22262f;
  --line:#28303c; --txt:#f4f6f8; --muted:#93a1b3;
  /* Γαλάζιο θέμα (οι μεταβλητές red* κρατούν το όνομα αλλά είναι γαλάζιες) */
  --red:#2f8fd8; --red2:#5bb2f0; --redsoft:#122c40;
  --gold:#e8b74a; --blue:#5bb2f0; --purple:#b07bff;
  --radius:14px; --shadow:0 6px 22px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(1200px 700px at 80% -10%,#1a1d25 0,var(--bg) 60%);
  color:var(--txt); font-family:"Segoe UI",system-ui,Roboto,Arial,sans-serif;
  font-size:15px; line-height:1.5; min-height:100vh;
}
a{color:var(--red2);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{margin:0 0 .5em;font-weight:700;letter-spacing:.2px}
h2{font-size:1.5rem;color:#fff}
h3{font-size:1.15rem;color:#fff}
.hidden{display:none!important}

/* Layout */
.app{display:flex;min-height:100vh}
.side{
  width:230px;flex-shrink:0;background:linear-gradient(180deg,#16181f,#101218);
  border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;
  overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px}
.brand .logo{
  width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--red),#134a7a);
  display:grid;place-items:center;font-weight:800;color:#fff;font-size:18px;box-shadow:var(--shadow)
}
.brand b{font-size:1.05rem;letter-spacing:.5px}
.brand small{display:block;color:var(--muted);font-size:.7rem;font-weight:400}
.nav{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.nav button{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;
  color:var(--muted);border:0;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:.92rem;
  font-family:inherit;transition:.15s
}
.nav button .ic{width:22px;text-align:center;font-size:1.05rem}
.nav button:hover{background:var(--panel);color:#fff}
.nav button.active{background:linear-gradient(90deg,var(--redsoft),transparent);color:#fff;box-shadow:inset 3px 0 0 var(--red)}
.side .tip{margin-top:18px;font-size:.72rem;color:var(--muted);padding:8px;border-top:1px solid var(--line)}

.main{flex:1;min-width:0;padding:26px 30px 60px;max-width:1200px;margin:0 auto;width:100%}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.topbar .who{font-size:.85rem;color:var(--muted)}
.topbar .who b{color:#fff}

/* Cards & UI */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:18px;box-shadow:var(--shadow)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.pill{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:.75rem;color:var(--muted);margin:2px 4px 2px 0}
.pill.red{background:var(--redsoft);border-color:var(--red);color:#ffd9dc}
.tag{font-size:.7rem;color:var(--gold);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.btn{
  background:linear-gradient(135deg,var(--red),#1a5fa0);color:#fff;border:0;padding:10px 18px;border-radius:10px;
  font-size:.9rem;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s;box-shadow:0 4px 14px rgba(47,143,216,.32)
}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:var(--panel2);box-shadow:none;border:1px solid var(--line);color:var(--txt)}
.btn.ghost:hover{border-color:var(--red);color:#fff}
.btn.sm{padding:6px 12px;font-size:.8rem}
.btn:disabled{opacity:.4;cursor:not-allowed}
label{display:block;font-size:.82rem;color:var(--muted);margin:12px 0 5px;font-weight:600}
input,select,textarea{
  width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--txt);
  border-radius:9px;padding:10px 12px;font-size:.9rem;font-family:inherit
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--red)}
textarea{resize:vertical;min-height:70px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1;min-width:140px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{
  background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:.82rem;
  cursor:pointer;user-select:none;transition:.12s
}
.chip.on{background:var(--redsoft);border-color:var(--red);color:#fff;font-weight:600}
.hint{font-size:.78rem;color:var(--muted);margin-top:4px}
.divider{height:1px;background:var(--line);margin:18px 0}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:.75rem;text-transform:uppercase;letter-spacing:.4px}
tr:hover td{background:var(--panel2)}
.subj-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.subj-item:last-child{border-bottom:0}
.stat{text-align:center;padding:14px}
.stat b{display:block;font-size:1.8rem;color:var(--red2)}
.stat span{font-size:.78rem;color:var(--muted)}
.progress{height:9px;background:var(--bg2);border-radius:999px;overflow:hidden;margin-top:6px}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--red2))}
.book{display:flex;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg2);margin-bottom:10px}
.book .cov{width:46px;height:62px;border-radius:6px;background:linear-gradient(135deg,var(--panel2),#0b0c10);display:grid;place-items:center;font-size:1.4rem;flex-shrink:0}
.book .meta{flex:1;min-width:0}
.book .meta b{display:block}
.book .meta small{color:var(--muted)}
.notice{background:var(--redsoft);border:1px solid var(--red);border-radius:10px;padding:12px 14px;font-size:.85rem;margin-bottom:14px}

/* Quiz */
.q-box{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}
.q-opt{display:block;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:11px 14px;margin:8px 0;cursor:pointer;transition:.12s}
.q-opt:hover{border-color:var(--red)}
.q-opt.sel{border-color:var(--red);background:var(--redsoft)}
.q-opt.correct{border-color:#e8b74a;background:#3a2f10}
.q-opt.wrong{border-color:#e0505c;background:#3a1418;opacity:.9}

/* Whiteboard */
#board-wrap{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
#board{display:block;width:100%;touch-action:none;cursor:crosshair;background:#fff}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.swatch{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);cursor:pointer}
.swatch.on{border-color:#fff;transform:scale(1.15)}

/* Onboarding modal */
.overlay{position:fixed;inset:0;background:rgba(5,6,9,.82);display:grid;place-items:center;z-index:50;padding:20px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:18px;max-width:560px;width:100%;padding:26px;box-shadow:var(--shadow);max-height:92vh;overflow-y:auto}
.steps{display:flex;gap:6px;margin-bottom:18px}
.steps i{flex:1;height:5px;border-radius:999px;background:var(--bg2)}
.steps i.on{background:var(--red)}

/* οριζόντια κύλιση για φαρδύ περιεχόμενο (πίνακες) σε κινητά */
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}

@media(max-width:820px){
  .app{flex-direction:column}
  .side{width:100%;height:auto;position:sticky;top:0;z-index:20;border-right:0;border-bottom:1px solid var(--line);padding:10px}
  .brand{padding:2px 4px 10px}
  /* Η πλοήγηση γίνεται οριζόντια μπάρα με κύλιση (μένει πάντα προσβάσιμη) */
  .nav{flex-direction:row;flex-wrap:nowrap;overflow-x:auto;gap:6px;padding-bottom:4px;-webkit-overflow-scrolling:touch}
  .nav button{width:auto;white-space:nowrap;flex:0 0 auto;padding:9px 12px}
  .nav button.active{box-shadow:inset 0 -3px 0 var(--red)}
  .side .tip{display:none}
  .main{padding:16px}
  .topbar h2{font-size:1.3rem}
}
@media(max-width:560px){
  body{font-size:14.5px}
  .main{padding:12px}
  .card{padding:15px}
  h2{font-size:1.2rem}
  .row>*{min-width:100%}          /* τα πεδία φόρμας το ένα κάτω από το άλλο */
  .g3,.g2{grid-template-columns:1fr}
  .stat b{font-size:1.5rem}
  .modal{padding:18px}
  .btn{padding:11px 16px}         /* μεγαλύτεροι στόχοι αφής */
  .chip,.nav button,.q-opt{min-height:42px;display:flex;align-items:center}
  .book .cov{width:40px;height:54px}
  .topbar .btn{padding:8px 12px;font-size:.82rem}
}

/* 🔄 ΟΡΙΖΟΝΤΙΑ ΘΕΣΗ (landscape) σε κινητό/tablet:
   επαναφορά πλαϊνής μπάρας & πλατιά, «μεγάλη» διάταξη που αξιοποιεί το φάρδος.
   Μπαίνει ΜΕΤΑ τα max-width queries ώστε να υπερισχύει σε landscape τηλέφωνα. */
@media (orientation: landscape) and (max-height: 600px){
  .app{flex-direction:row}
  .side{width:172px;height:100vh;position:sticky;top:0;z-index:20;
        border-right:1px solid var(--line);border-bottom:0;padding:8px 6px;overflow-y:auto}
  .brand{padding:2px 4px 8px}
  .brand .logo{width:30px;height:30px;font-size:14px;border-radius:8px}
  .brand b{font-size:.9rem}
  .brand small{font-size:.62rem}
  .nav{flex-direction:column;flex-wrap:nowrap;overflow:visible;gap:2px}
  .nav button{width:100%;white-space:normal;padding:7px 9px;font-size:.82rem;min-height:0}
  .nav button .ic{width:20px;font-size:.95rem}
  .nav button.active{box-shadow:inset 3px 0 0 var(--red)}
  .side .tip{display:block;font-size:.62rem}
  .main{padding:12px 16px}
  .topbar h2{font-size:1.15rem}
  /* περισσότερες στήλες όταν υπάρχει πλάτος */
  .g2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
  .g3{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
  .row>*{min-width:150px}
}

/* Μέγεθος γραμμάτων (κλιμακώνεται μέσω html font-size) & Light theme */
html{font-size:15px}
body{font-size:1rem}
:root.theme-light{
  --bg:#eef1f5; --bg2:#ffffff; --panel:#ffffff; --panel2:#eef2f7;
  --line:#d7dee8; --txt:#18202c; --muted:#586372; --redsoft:#e7f0fb;
  --shadow:0 6px 20px rgba(30,60,90,.12);
}
:root.theme-light body{background:var(--bg)}
:root.theme-light .side{background:linear-gradient(180deg,#f7f9fc,#eef2f7)}
:root.theme-light .q-opt.correct{background:#fff7e0}
:root.theme-light .q-opt.wrong{background:#fde8ea;color:#7a1620}

/* Toast ειδοποιήσεις (διακριτικές, δεν μπλοκάρουν) */
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,120%);z-index:80;
  background:var(--panel2);color:var(--txt);border:1px solid var(--red);border-radius:12px;
  padding:11px 18px;font-size:.9rem;font-weight:600;box-shadow:var(--shadow);opacity:0;
  transition:transform .3s cubic-bezier(.2,.9,.3,1.3),opacity .3s;max-width:88vw;pointer-events:none}
#toast.show{transform:translate(-50%,0);opacity:1}
/* Confetti canvas (γιορτή στα ορόσημα) */
#confetti{position:fixed;inset:0;z-index:90;pointer-events:none}
/* Απαλή είσοδος καρτών όταν αλλάζει ενότητα (μόνο στο render, όχι σε κάθε αναζήτηση) */
@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#views.enter .card{animation:cardIn .34s ease both}
#views.enter>.card:nth-child(2){animation-delay:.04s}
#views.enter>.card:nth-child(3){animation-delay:.08s}
#views.enter>.card:nth-child(4){animation-delay:.12s}
#views.enter>.card:nth-child(5){animation-delay:.16s}
#views.enter>.card:nth-child(n+6){animation-delay:.2s}
@media (prefers-reduced-motion: reduce){#views.enter .card{animation:none} #toast{transition:opacity .15s}}

/* Print */
@media print{
  .side,.topbar .btn,.no-print,.nav{display:none!important}
  body,.main{background:#fff;color:#000}
  .card{box-shadow:none;border:1px solid #999;break-inside:avoid}
  a{color:#000}
  .q-opt{border:1px solid #999}
  #print-area *{color:#000!important}
  table th,table td{border-bottom:1px solid #999}
}
</style>

<div class="app">

<!-- Πλήρης βάση σχολών (763 τμήματα, βάσεις 2026 & 2025 — πηγή AeiTei.gr/Υπ. Παιδείας) -->
<script src="schools-data.js"></script>
<script>
/* =========================================================================
   ΣΧΟΛΕΙΟ 360° — offline study companion
   Δεδομένα, κατάσταση (localStorage), αυτόματο πρόγραμμα, κουίζ, πίνακας.
   ========================================================================= */

/* ---------- STATE ---------- */
const LS='sxoleio360';
const DEFAULT={
  profile:null,           // {name,type,grade,goal,field,ktDept,ktSubjects,hoursDay,daysWeek,targetDate,strong[],weak[]}
  progress:{},            // subjectKey -> percent
  quizScores:[],          // {subject,score,total,date}
  customBooks:[],         // {title,author,link,note}
  schedule:null,          // generated plan
  done:{},                // "week-day-idx" -> true (schedule checkboxes)
  favorites:[],           // αγαπημένες σχολές [{id,d,inst,city,f,b26,b25}]
  notes:{},               // σημειώσεις ανά μάθημα {subject: text}
  wrong:{},               // λάθος ερωτήσεις ανά μάθημα {subject:[q...]}
  customCards:[],         // flashcards χρήστη [{subject,front,back}]
  cardKnown:{},           // {cardKey:true} (legacy)
  cardSR:{},              // spaced repetition {cardKey:{reps,interval,ease,due}}
  prefs:{theme:'dark',font:1,sound:true}, // θέμα & μέγεθος γραμμάτων & ήχοι
  pomodoros:0,            // ολοκληρωμένες συνεδρίες μελέτης
  stats:{lastActive:'',streak:0,cardsReviewed:0} // σερί ημερών & στατιστικά
};
let S=load();
function load(){try{return Object.assign(JSON.parse(JSON.stringify(DEFAULT)),JSON.parse(localStorage.getItem(LS))||{})}catch(e){return JSON.parse(JSON.stringify(DEFAULT))}}
function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){/* localStorage μη διαθέσιμο (π.χ. ιδιωτική περιήγηση) — συνεχίζουμε χωρίς αποθήκευση */}}
function applyPrefs(){
  const p=S.prefs||(S.prefs={theme:'dark',font:1});
  document.documentElement.classList.toggle('theme-light', p.theme==='light');
  document.documentElement.style.fontSize=(15*(p.font||1))+'px';
}
function toggleFullscreen(){
  const d=document, el=d.documentElement;
  try{
    if(!d.fullscreenElement && !d.webkitFullscreenElement){
      (el.requestFullscreen||el.webkitRequestFullscreen||el.msRequestFullscreen||function(){alert('Η συσκευή σου δεν υποστηρίζει πλήρη οθόνη από τον browser. Αν το έχεις εγκαταστήσει ως εφαρμογή (Προσθήκη στην αρχική οθόνη), ανοίγει ήδη χωρίς μπάρα.');}).call(el);
    } else {
      (d.exitFullscreen||d.webkitExitFullscreen||d.msExitFullscreen||function(){}).call(d);
    }
  }catch(e){}
}
document.addEventListener('fullscreenchange',()=>{const b=document.getElementById('fs-btn');if(b)b.textContent=document.fullscreenElement?'⤢ Έξοδος':'⛶ Πλήρης οθόνη';});
/* Διακριτική ειδοποίηση toast */
function toast(msg,icon){
  let t=document.getElementById('toast'); if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t);}
  t.innerHTML=(icon||'✓')+' '+String(msg).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
  t.classList.add('show'); clearTimeout(window.__toastT); window.__toastT=setTimeout(()=>t.classList.remove('show'),2200);
  try{if(navigator.vibrate)navigator.vibrate(15);}catch(e){}
}
/* Ήχος επιτυχίας (απαλή άνοδος νότας) — σέβεται τη ρύθμιση ήχου */
function chime(){
  if(S.prefs && S.prefs.sound===false) return;
  try{
    const ac=new (window.AudioContext||window.webkitAudioContext)(), now=ac.currentTime;
    [[523.25,0],[659.25,0.09],[783.99,0.18],[1046.5,0.27]].forEach(([f,t])=>{
      const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;o.connect(g);g.connect(ac.destination);

/* Γιορτή με κομφετί στα ορόσημα */
function confetti(){
  chime();
  let cv=document.getElementById('confetti'); if(!cv){cv=document.createElement('canvas');cv.id='confetti';document.body.appendChild(cv);}
  const ctx=cv.getContext('2d'), W=cv.width=innerWidth, H=cv.height=innerHeight;
  const cols=['#2f8fd8','#5bb2f0','#e8b74a','#ffffff','#e0505c'];
  const P=Array.from({length:Math.min(160,Math.round(W/6))},()=>({x:Math.random()*W,y:-20-Math.random()*H*0.4,r:5+Math.random()*7,c:cols[Math.random()*cols.length|0],vx:-2.5+Math.random()*5,vy:2+Math.random()*4,rot:Math.random()*6,vr:-0.25+Math.random()*0.5}));
  const start=performance.now();
  (function loop(now){
    ctx.clearRect(0,0,W,H); let alive=false;
    P.forEach(p=>{p.vy+=0.06;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr; if(p.y<H+20)alive=true;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*0.6);ctx.restore();});
    if(alive && now-start<2800) requestAnimationFrame(loop); else cv.remove();
  })(start);
}

const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function allSubjects(){const set=new Set();LEVELS.forEach(l=>l.grades.forEach(g=>g.subjects.forEach(s=>set.add(s.replace(/&amp;/g,'&')))));return [...set].sort((a,b)=>a.localeCompare(b,'el'));}

const TITLES={home:'Αρχική',subjects:'Μαθήματα & Ύλη',exams:'Πανελλήνιες / Κατατακτήριες',syllabus:'Εξεταστέα Ύλη',careers:'Σχολές & Επαγγέλματα',schedule:'Πρόγραμμα Διαβάσματος',library:'Βιβλιοθήκη',quiz:'Διαγωνίσματα / Κουίζ',board:'Διαδραστικός Πίνακας',notes:'Σημειώσεις',pomodoro:'Χρονόμετρο Μελέτης',settings:'Προφίλ & Ρυθμίσεις'};
function go(v){
  $$('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));
  $('#view-title').textContent=TITLES[v]||'';
  const c=$('#views');c.innerHTML='';
  if(window.__pomoInt){clearInterval(window.__pomoInt);window.__pomoInt=null;window.__pomoRunning=false;} // pause χρονόμετρο όταν φεύγεις
  ({home:viewHome,subjects:viewSubjects,exams:viewExams,syllabus:viewSyllabus,careers:viewCareers,schedule:viewSchedule,library:viewLibrary,quiz:viewQuiz,board:viewBoard,notes:viewNotes,pomodoro:viewPomodoro,settings:viewSettings}[v]||viewHome)(c);
  c.classList.add('enter');clearTimeout(window.__enterT);window.__enterT=setTimeout(()=>c.classList.remove('enter'),700);
  window.scrollTo(0,0);
}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button');if(b)go(b.dataset.view);});

  $('#who').innerHTML = p ? `👤 <b>${esc(p.name||'Μαθητής')}</b> · ${esc(p.typeLabel||'')}${p.gradeLabel?' · '+esc(p.gradeLabel):''}${p.goalLabel?' · 🎯 '+esc(p.goalLabel):''}` : 'Συμπλήρωσε το προφίλ σου για εξατομικευμένο πρόγραμμα.';
}

/* =========================================================================
   VIEW: HOME / DASHBOARD
   ========================================================================= */
function viewHome(c){
  const p=S.profile;
  if(!p){
    c.appendChild(el('div','notice','👋 Καλωσήρθες! Δεν έχεις προφίλ ακόμα. Πάτησε «Ξεκίνα» για να απαντήσεις μερικές ερωτήσεις και να φτιαχτεί αυτόματα πρόγραμμα διαβάσματος.'));
    const b=el('button','btn','🚀 Ξεκίνα το ερωτηματολόγιο');b.onclick=()=>openOnboard();c.appendChild(b);
  }
  // 💬 Καθημερινό μήνυμα κινήτρου
  const MOT=['Κάθε μέρα λίγο, φτάνεις μακριά.','Η συνέπεια νικάει το ταλέντο.','Δεν χρειάζεται να είσαι τέλειος — απλώς συνέχισε.',
    'Το καλύτερο διάβασμα είναι αυτό που κάνεις σήμερα.','Μικρά βήματα, μεγάλα αποτελέσματα.','Πίστεψε στον εαυτό σου — μπορείς!',
    'Η προσπάθεια πάντα ανταμείβεται.','Ένα κεφάλαιο τη φορά.','Η γνώση είναι δύναμη — χτίσ’ την κάθε μέρα.',
    'Ξεκούραση + μελέτη = επιτυχία.','Οι μεγάλες επιτυχίες ξεκινούν από μια μικρή απόφαση.','Σήμερα είναι καλή μέρα για να μάθεις κάτι νέο.'];
  const mi=Math.floor(Date.now()/86400000)%MOT.length;
  c.appendChild(el('div',null,`<div style="text-align:center;color:var(--muted);font-style:italic;font-size:.92rem;margin:2px 0 10px">💬 ${MOT[mi]}</div>`));
  // ⏳ Αντίστροφη μέτρηση εξετάσεων
  if(p && p.targetDate){
    const dU=daysUntil(p.targetDate);
    if(dU!=null && dU>=0){
      const cd=el('div','card');cd.style.cssText='text-align:center;background:linear-gradient(90deg,var(--redsoft),transparent)';
      cd.innerHTML=`<div class="tag">Αντίστροφη μέτρηση</div><div style="font-size:2.4rem;font-weight:800;color:var(--red2)">${dU} <span style="font-size:1rem;color:var(--muted)">ημέρες</span></div><p class="hint">έως ${new Date(p.targetDate).toLocaleDateString('el-GR')} · ${esc(p.goalLabel||'στόχος')}</p>`;
      c.appendChild(cd);
    }
  }
  // stats
  const grid=el('div','grid g3');
  const totalQ=S.quizScores.reduce((a,x)=>a+x.total,0), gotQ=S.quizScores.reduce((a,x)=>a+x.score,0);
  const doneCnt=Object.values(S.done).filter(Boolean).length;
  const stats=[
    {b:S.quizScores.length,s:'Κουίζ που έλυσες'},
    {b:totalQ?Math.round(gotQ/totalQ*100)+'%':'—',s:'Μέση επιτυχία'},
    {b:doneCnt,s:'Ολοκληρωμένες μελέτες'},
    {b:S.customBooks.length,s:'Βιβλία στη βιβλιοθήκη σου'}
  ];
  stats.forEach(x=>{const card=el('div','card stat');card.innerHTML=`<b>${x.b}</b><span>${x.s}</span>`;grid.appendChild(card);});
  c.appendChild(grid);

  // 🏆 Επιτεύγματα & σερί
  {
    const st=computeStats();
    const ac=el('div','card');
    ac.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
      <div><div class="tag">Επιτεύγματα</div><h3 style="margin:0">🏆 Πρόοδος &amp; κίνητρο</h3></div>
      <div style="text-align:right"><div style="font-size:1.6rem;font-weight:800;color:var(--red2)">🔥 ${st.streak}</div><small class="hint">μέρες σερί</small></div></div>`;
    const g2=el('div','grid g3');g2.style.marginTop='10px';
    [['🃏',st.cardsReviewed,'επαναλήψεις'],['🍅',st.pomodoros,'Pomodoro'],['⭐',st.favorites,'αγαπημένα']].forEach(m=>{const t=el('div','stat');t.innerHTML=`<b>${m[0]} ${m[1]}</b><span>${m[2]}</span>`;g2.appendChild(t);});
    ac.appendChild(g2);
    const cnt=ACHIEVEMENTS.filter(a=>a.t(st)).length;
    const hd=el('p','hint');hd.style.margin='12px 0 4px';hd.innerHTML=`<b>${cnt}/${ACHIEVEMENTS.length}</b> κονκάρδες ξεκλειδωμένες`;
    ac.appendChild(hd);
    const badges=el('div');badges.style.cssText='display:flex;flex-wrap:wrap;gap:10px;margin-top:6px';
    ACHIEVEMENTS.forEach(a=>{const un=a.t(st);const b=el('div');b.title=a.d;b.style.cssText=`text-align:center;width:82px;opacity:${un?1:.35};filter:${un?'none':'grayscale(1)'}`;b.innerHTML=`<div style="font-size:1.8rem">${a.i}</div><small style="display:block;font-weight:${un?700:400};font-size:.68rem;line-height:1.2">${esc(a.n)}</small>`;badges.appendChild(b);});
    ac.appendChild(badges);
    const shareB=el('button','btn ghost sm no-print','📤 Μοιράσου την πρόοδό μου');shareB.style.marginTop='12px';shareB.onclick=shareProgress;ac.appendChild(shareB);
    c.appendChild(ac);
  }

  // ⭐ Αγαπημένες σχολές
  if(S.favorites && S.favorites.length){
    const fc=el('div','card');
    fc.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
      <div><div class="tag">Αγαπημένα</div><h3 style="margin:0">⭐ Οι σχολές μου (${S.favorites.length})</h3></div>
      <button class="btn ghost sm no-print" id="fav-go">🏛️ Σχολές &amp; Επαγγέλματα →</button></div>`;
    const wrap=el('div','scrollx');wrap.style.marginTop='10px';
    const rows=S.favorites.map((s,i)=>`<tr>
      <td><b>${esc(s.d)}</b><br><small style="color:var(--muted)">${esc(s.inst)}${s.city?' · '+esc(s.city):''}</small><br><small style="color:var(--blue)">💼 ${esc(careerHint(s.d))}</small></td>
      <td style="white-space:nowrap">${s.b26!=null?fmtMoria(s.b26):'—'}</td><td>${deltaHtml(s.b26,s.b25)}</td>
      <td class="no-print"><button class="btn ghost sm" data-rmfav="${i}" title="Αφαίρεση">✕</button></td></tr>`).join('');
    wrap.innerHTML=`<table><thead><tr><th>Σχολή / Ίδρυμα</th><th>Βάση 2026</th><th>Δ 25→26</th><th class="no-print"></th></tr></thead><tbody>${rows}</tbody></table>`;
    fc.appendChild(wrap);c.appendChild(fc);
    const goBtn=$('#fav-go',fc); if(goBtn) goBtn.onclick=()=>go('careers');
    $$('[data-rmfav]',fc).forEach(b=>b.onclick=()=>{S.favorites.splice(+b.dataset.rmfav,1);save();go('home');});
  }

  // 📖 Τι διαβάζω σήμερα
  const tp=todayPlan();
  if(tp){
    const tc=el('div','card');
    tc.innerHTML=`<div class="tag">Σήμερα ${new Date().toLocaleDateString('el-GR',{weekday:'long',day:'2-digit',month:'2-digit'})}</div><h3>📖 Τι διαβάζω σήμερα ${tp.rev?'<span class="pill red">🔁 Επανάληψη</span>':''}</h3>`;
    const ul=el('div');ul.style.marginTop='6px';
    ul.innerHTML=tp.sessions.map((s,si)=>{const id=`${tp.w}-${tp.d}-${si}`,ck=S.done[id]?'checked':'';
      return `<label style="display:flex;align-items:center;gap:8px;margin:6px 0;cursor:pointer"><input type="checkbox" style="width:auto" data-today="${id}" ${ck}> <span><b>${esc(s.subject)}</b>${s.topic?` <small style="color:var(--blue)">— ${esc(s.topic)}</small>`:''} <small style="color:var(--muted)">(1ω)</small></span></label>`;}).join('');
    tc.appendChild(ul);
    const gob=el('button','btn ghost sm no-print','🗓️ Όλο το πρόγραμμα →');gob.onclick=()=>go('schedule');tc.appendChild(gob);
    c.appendChild(tc);
    $$('[data-today]',tc).forEach(cb=>cb.onchange=()=>{S.done[cb.dataset.today]=cb.checked;save();if(cb.checked)touchActivity();
      if(cb.checked && $$('[data-today]',tc).every(x=>x.checked)){confetti();toast('Ολοκλήρωσες τη σημερινή μελέτη! 🔥','🎉');}});
  }
  // 📈 Τάση κουίζ
  if(S.quizScores.length>=2){
    const qt=el('div','card');qt.innerHTML=`<div class="tag">Πρόοδος</div><h3>📈 Τάση στα κουίζ</h3>`;
    const last=S.quizScores.slice(-8);
    const bars=last.map(x=>{const pct=Math.round(x.score/x.total*100);return `<div title="${esc(x.subject)} ${x.date}: ${x.score}/${x.total}" style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px"><div style="width:70%;height:${Math.max(6,pct)}px;background:${pct>=50?'linear-gradient(var(--red2),var(--red))':'#e0505c'};border-radius:4px 4px 0 0"></div><small style="color:var(--muted);font-size:.62rem">${pct}%</small></div>`;}).join('');
    const box=el('div');box.style.cssText='display:flex;align-items:flex-end;gap:6px;height:120px;margin-top:8px';box.innerHTML=bars;
    qt.appendChild(box);c.appendChild(qt);
  }
  // 🃏 Κάρτες για επανάληψη σήμερα
  if(S.cardSR && Object.keys(S.cardSR).length){
    const dc=dueCount();
    if(dc>0){
      const fr=el('div','card');
      fr.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px"><div><div class="tag">Επανάληψη</div><h3 style="margin:0">🃏 ${dc} κάρτες για επανάληψη σήμερα</h3></div><button class="btn sm no-print" id="fc-goto">▶️ Ξεκίνα</button></div>`;
      c.appendChild(fr);
      const g=$('#fc-goto',fr); if(g) g.onclick=()=>{window.__quizTab='cards';go('quiz');};
    }
  }

  // Today / next steps
  const q=el('div','grid g2');
  const a=el('div','card');
  a.innerHTML=`<div class="tag">Επόμενα βήματα</div><h3>Τι να κάνω σήμερα;</h3>`;
  const ul=el('div');
  const steps=[];
  if(!p) steps.push('Συμπλήρωσε το προφίλ σου (κουμπί πάνω).');
  else{
    if(!S.schedule) steps.push('Φτιάξε το <b>αυτόματο πρόγραμμα διαβάσματος</b> στην ενότητα 🗓️.');
    steps.push('Διάβασε τη σημερινή ενότητα από το πρόγραμμα και τσέκαρέ την.');
    steps.push('Λύσε ένα <b>κουίζ</b> στο αδύναμο μάθημά σου για εξάσκηση.');
    steps.push('Άνοιξε το <b>σχολικό βιβλίο</b> ή ένα λογοτεχνικό από τη Βιβλιοθήκη.');
  }
  ul.innerHTML='<ul style="margin:10px 0 0;padding-left:18px">'+steps.map(s=>`<li style="margin:6px 0">${s}</li>`).join('')+'</ul>';
  a.appendChild(ul);
  q.appendChild(a);

  const b2=el('div','card');
  b2.innerHTML=`<div class="tag">Γρήγορη πρόσβαση</div><h3>Συντομεύσεις</h3>`;
  const qa=el('div','row');qa.style.marginTop='10px';
  [['📚 Μαθήματα','subjects'],['🎓 Εξετάσεις','exams'],['🗓️ Πρόγραμμα','schedule'],['📝 Κουίζ','quiz'],['🖊️ Πίνακας','board'],['📖 Βιβλιοθήκη','library']].forEach(([t,v])=>{
    const bb=el('button','btn ghost sm',t);bb.style.flex='1 1 40%';bb.onclick=()=>go(v);qa.appendChild(bb);
  });
  b2.appendChild(qa);q.appendChild(b2);
  c.appendChild(q);

  if(p && p.goal==='pan' && p.field!=null && FIELDS[p.field]){
    const f=FIELDS[p.field];
    const fc=el('div','card');
    fc.innerHTML=`<div class="tag">Ο στόχος σου</div><h3>${f.n}</h3><p style="color:var(--muted)">Εξεταζόμενα μαθήματα:</p>`+
      f.subs.map(s=>`<span class="pill red">${s}</span>`).join('')+
      `<p class="hint" style="margin-top:10px">Ενδεικτικές σχολές: ${f.ex}</p>`;
    c.appendChild(fc);
  }
}

   <ul style="padding-left:18px">

   <li>Χρησιμοποίησε το <b>αυτόματο πρόγραμμα</b> με βάση την ημερομηνία εξέτασης.</li></ul>
   <p><a href="https://www.minedu.gov.gr/" target="_blank" rel="noopener">🏛️ Υπουργείο Παιδείας — θεσμικό πλαίσιο κατατακτηρίων</a></p>`;
  host.appendChild(info);
}

const fmtMoria=v=>v.toLocaleString('el-GR');
function baseChart(base){
  const ys=['22','23','24','25','26'];
  const pts=ys.map(y=>({y,v:base[y]})).filter(p=>p.v!=null);
  if(!pts.length) return '';
  const vals=pts.map(p=>p.v), min=Math.min(...vals), max=Math.max(...vals), span=Math.max(1,max-min);
  const W=320,H=118,padB=20,padT=20, n=pts.length, gap=14, barW=(W-gap*(n+1))/n;
  let bars='';
  pts.forEach((p,i)=>{
    const x=gap+i*(barW+gap);
    const h=12+(p.v-min)/span*(H-padB-padT-12);
    const yTop=H-padB-h, latest=(p.y==='26');
    bars+=`<rect x="${x.toFixed(1)}" y="${yTop.toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" rx="4" fill="${latest?'#e8b74a':'#2f8fd8'}"/>`;
    bars+=`<text x="${(x+barW/2).toFixed(1)}" y="${(yTop-5).toFixed(1)}" text-anchor="middle" font-size="9.5" fill="${latest?'#e8b74a':'var(--muted)'}" font-weight="${latest?'700':'400'}">${fmtMoria(p.v)}</text>`;

/* βρες αντίστοιχο «δημοφιλές» τμήμα (για γράφημα 5ετίας/μαθήματα στη σύγκριση) */
function findFeatured(s){
  return SCHOOLS.find(f=>f.f===s.f && _norm(f.n)===_norm(s.d) && (_norm(s.inst).includes(_norm(f.inst.split(' ')[0]))||_norm(s.city).includes(_norm((f.inst.match(/\(([^)]+)\)/)||[,''])[1].split(' ').pop()||''))));
}

/* --- 1) ΒΡΕΣ ΜΕ ΤΑ ΜΟΡΙΑ ΜΟΥ --- */
function renderMatcher(host){
  host.innerHTML='';
  const card=el('div','card no-print');
  card.innerHTML=`<div class="tag">Εύρεση σχολών</div><h3>🎯 Πού μπαίνω με τα μόριά μου;</h3>
    <p class="hint">Βάλε τα μόρια που εκτιμάς ότι έχεις (0–20.000) και το πεδίο σου. Θα δεις τις σχολές που «πιάνεις» με βάση το 2026.</p>`;
  const r=el('div','row');
  r.innerHTML=`<div><label>Τα μόριά μου (εκτίμηση)</label><input id="mt-mor" type="number" min="0" max="20000" step="10" placeholder="π.χ. 16500" value="${(S.profile&&S.profile.myMoria)||''}"></div>
    <div><label>Επιστημονικό πεδίο</label><select id="mt-field"><option value="all">Όλα τα πεδία</option>${FIELDS.map((f,i)=>`<option value="${i}">${canon(f.n)}</option>`).join('')}</select></div>
    <div><label>Πόλη</label><select id="mt-city">${cityOptionsHtml()}</select></div>`;
  card.appendChild(r);
  const btn=el('button','btn','🔎 Βρες σχολές');btn.style.marginTop='12px';card.appendChild(btn);
  host.appendChild(card);

  // 🧮 Υπολογιστής μορίων από βαθμούς
  const calc=el('div','card no-print');
  calc.innerHTML=`<details><summary style="cursor:pointer;font-weight:600">🧮 Δεν ξέρεις τα μόριά σου; Υπολόγισέ τα από τους βαθμούς</summary><div id="calc-body" style="margin-top:12px"></div></details>`;
  host.appendChild(calc);
  const buildCalc=(field)=>{
    const body=$('#calc-body',calc), subs=FIELDS[field].subs.map(canon), w=MORIA_W[field];
    body.innerHTML=`<div class="row"><div><label>Πεδίο</label><select id="calc-field">${FIELDS.map((f,i)=>`<option value="${i}" ${i===field?'selected':''}>${canon(f.n).split('—')[0].trim()}</option>`).join('')}</select></div></div>
      <p class="hint" style="margin:.5em 0">Βάλε τους βαθμούς σου (0–20). Τα μαθήματα ×1.3 / ×0.7 μετρούν περισσότερο.</p>
      <div class="row">${subs.map((s,i)=>`<div><label>${esc(s)} ${i===w.a?'<span style="color:var(--gold)">×1.3</span>':i===w.b?'<span style="color:var(--gold)">×0.7</span>':''}</label><input class="calc-g" type="number" min="0" max="20" step="0.1" placeholder="0-20"></div>`).join('')}</div>
      <button class="btn" id="calc-go" style="margin-top:12px">🧮 Υπολόγισε μόρια</button><div id="calc-res" style="margin-top:12px"></div>`;
    $('#calc-field',body).onchange=e=>buildCalc(+e.target.value);
    $('#calc-go',body).onclick=()=>{
      const gs=$$('.calc-g',body).map(x=>Math.min(20,Math.max(0,parseFloat(x.value)||0)));
      const m=computeMoria(field,gs);
      $('#calc-res',body).innerHTML=`<div class="card" style="margin:0"><h3 style="color:var(--red2);margin:0">≈ ${fmtMoria(m)} μόρια</h3>
        <p class="hint">Εκτίμηση με τον κλασικό τύπο (ΓΒΠ×8 + ×1.3 + ×0.7). Από το 2022 τα ακριβή μόρια εξαρτώνται από τους <b>συντελεστές βαρύτητας κάθε τμήματος</b> — χρησιμοποίησέ το ως προσανατολισμό.</p>
        <button class="btn sm" id="calc-use">➡️ Χρήση στην «Βρες σχολές»</button></div>`;
      $('#calc-use',body).onclick=()=>{$('#mt-mor').value=m;$('#mt-field').value=String(field);$('#mt-city').value='all';if(S.profile){S.profile.myMoria=m;save();}btn.onclick();window.scrollTo(0,0);};
    };
  };
  buildCalc(defaultField()!=='all'?+defaultField():0);

  const res=el('div');host.appendChild(res);
  $('#mt-field').value=defaultField();
  btn.onclick=()=>{
    const m=parseInt($('#mt-mor').value,10);
    if(isNaN(m)||m<=0){alert('Γράψε έγκυρα μόρια (π.χ. 16500).');return;}
    if(S.profile){S.profile.myMoria=m;save();}
    const fsel=$('#mt-field').value, citySel=$('#mt-city').value;
    let list=allSchoolsList().filter(s=>s.b26!=null);
    if(fsel!=='all') list=list.filter(s=>s.f===+fsel);
    if(citySel&&citySel!=='all') list=list.filter(s=>s.city===citySel);
    const inside=list.filter(s=>s.b26<=m).sort((a,b)=>b.b26-a.b26);
    const near=list.filter(s=>s.b26>m && s.b26<=m+1000).sort((a,b)=>a.b26-b.b26);
    res.innerHTML='';
    const crit=`${fmtMoria(m)} μόρια · ${fsel!=='all'?canon(FIELDS[+fsel].n).split('—')[0].trim():'Όλα τα πεδία'}${citySel!=='all'?' · '+citySel:''}`;
    const sum=el('div','card');
    sum.innerHTML=`<div class="tag">Φύλλο «Πού μπαίνω»</div>
      <h3 style="color:var(--red2)">✅ Πιάνεις ${inside.length} σχολές${fsel!=='all'?' στο '+canon(FIELDS[+fsel].n).split('—')[0].trim():''}</h3>
      <p class="hint">${esc(crit)} · ${new Date().toLocaleDateString('el-GR')} — βάσεις 2026 (ΓΕΛ 90%), πηγή AeiTei.gr. Ταξινόμηση από την υψηλότερη βάση που «πιάνεις».</p>`;
    const bar=el('div','row no-print');bar.style.marginTop='4px';
    const pb=el('button','btn sm','🖨️ Εκτύπωση / PDF');pb.onclick=()=>window.print();
    const cb=el('button','btn ghost sm','⬇️ Εξαγωγή CSV (Excel)');cb.onclick=()=>matcherCSV(inside,near,m);
    bar.appendChild(pb);bar.appendChild(cb);sum.appendChild(bar);
    res.appendChild(sum);
    if(inside.length) res.appendChild(schoolsTable(inside,m));
    if(near.length){
      const nc=el('div','card');
      nc.innerHTML=`<div class="tag">Στόχος</div><h3>🎯 Λίγο πιο πάνω (έως +1000 μόρια)</h3><p class="hint">Σχολές που θα «άνοιγαν» με λίγα παραπάνω μόρια — καλοί στόχοι.</p>`;
      nc.appendChild(schoolsTable(near,m));
      res.appendChild(nc);
    }
    if(!inside.length&&!near.length) res.appendChild(el('div','card','<p class="hint">Δεν βρέθηκαν σχολές. Δοκίμασε άλλα μόρια/πεδίο.</p>'));
  };
}
function schoolsTable(list,myM){
  const wrap=el('div','scrollx');
  const cap= list.length>250;
  const rows=(cap?list.slice(0,250):list).map(s=>{
    const marg=(myM!=null&&s.b26!=null)?(myM-s.b26):null;
    const margH=marg==null?'':`<span style="color:${marg>=0?'#e8b74a':'#e0505c'}">${marg>=0?'+':''}${fmtMoria(marg)}</span>`;
    return `<tr><td style="text-align:center" class="no-print">${favBtn(s)}</td><td><b>${esc(s.d)}</b><br><small style="color:var(--muted)">${esc(s.inst)}</small><br><small style="color:var(--blue)">💼 ${esc(careerHint(s.d))}</small></td>
      <td>${esc(s.city)}</td><td style="white-space:nowrap">${s.b26!=null?fmtMoria(s.b26):'—'}</td>
      <td>${deltaHtml(s.b26,s.b25)}</td><td>${margH}</td></tr>`;
  }).join('');
  wrap.innerHTML=`<table><thead><tr><th class="no-print">★</th><th>Σχολή / Ίδρυμα</th><th>Πόλη</th><th>Βάση 2026</th><th>Δ 25→26</th><th>Περιθώριο</th></tr></thead><tbody>${rows}</tbody></table>${cap?'<p class="hint">Εμφανίζονται οι πρώτες 250 — στένεψε το πεδίο για λιγότερες.</p>':''}`;
  wireFav(wrap);
  return wrap;
}

/* --- 2) ΑΝΑΛΥΤΙΚΑ ΔΗΜΟΦΙΛΗ (με γραφήματα 5ετίας) --- */
function renderFeatured(host){
  host.innerHTML='';
  const ctl=el('div','card no-print');
  ctl.innerHTML=`<div class="tag">Φίλτρα</div><p class="hint">Επιλεγμένα δημοφιλή τμήματα με ανάλυση μαθημάτων, επαγγελμάτων & <b>5ετούς πορείας (2022–2026)</b>.</p>`;
  const row=el('div','row');
  row.innerHTML=`<div><label>Επιστημονικό πεδίο</label><select id="cr-field"><option value="all">Όλα τα πεδία</option>${FIELDS.map((f,i)=>`<option value="${i}">${canon(f.n)}</option>`).join('')}</select></div>
    <div><label>Αναζήτηση τμήματος</label><input id="cr-q" placeholder="π.χ. Ιατρική, Πληροφορική..."></div>`;
  ctl.appendChild(row);host.appendChild(ctl);
  const list=el('div');host.appendChild(list);
  function draw(){
    list.innerHTML='';
    const fsel=$('#cr-field').value, q=($('#cr-q').value||'').trim().toLowerCase();
    let items=SCHOOLS.slice();
    if(fsel!=='all') items=items.filter(s=>s.f===+fsel);
    if(q) items=items.filter(s=>(s.n+' '+s.inst).toLowerCase().includes(q));
    if(!items.length){list.appendChild(el('div','card','<p class="hint">Δεν βρέθηκε τμήμα.</p>'));return;}
    FIELDS.forEach((f,fi)=>{
      const g=items.filter(s=>s.f===fi); if(!g.length) return;
      const head=el('div','card');head.style.cssText='background:linear-gradient(90deg,var(--redsoft),transparent)';
      head.innerHTML=`<div class="tag">${f.group.replace(/&amp;/g,'&')}</div><h3 style="margin:0">${canon(f.n)}</h3>`;
      list.appendChild(head);
      g.forEach(s=>{
        const card=el('div','card');
        card.innerHTML=`<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline">
            <h3 style="margin:0">${esc(s.n)}</h3><span class="tag" style="color:var(--muted)">${esc(s.inst)}</span></div>
          <div class="grid g2" style="margin-top:10px;align-items:start">
            <div><p style="margin:.2em 0"><b>📘 Τι μαθαίνεις:</b></p>
              <div>${s.courses.map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</div>
              <p style="margin:.8em 0 .2em"><b>💼 Επαγγέλματα:</b></p>
              <ul style="margin:.2em 0;padding-left:18px">${s.jobs.map(x=>`<li style="margin:3px 0">${esc(x)}</li>`).join('')}</ul></div>
            <div><p style="margin:.2em 0"><b>📊 Βάση (μόρια) — 5ετία:</b></p>${baseChart(s.base)}${baseTrend(s.base)}</div>
          </div>`;
        list.appendChild(card);
      });
    });
  }
  $('#cr-field').value=defaultField();
  $('#cr-field').onchange=draw; $('#cr-q').oninput=draw; draw();
}

/* --- 3) ΟΛΕΣ ΟΙ ΣΧΟΛΕΣ --- */
function renderAll(host){
  host.innerHTML='';
  const D=window.SCHOOLS_DATA;
  const ctl=el('div','card no-print');
  ctl.innerHTML=`<div class="tag">Όλες οι σχολές</div><p class="hint">${D?D.rows.length:0} τμήματα (ΑΕΙ, Στρατιωτικές/Αστυνομικές, ΤΕΦΑΑ). Βάσεις 2026 & μεταβολή από 2025.</p>`;
  const row=el('div','row');
  row.innerHTML=`<div><label>Επιστημονικό πεδίο</label><select id="al-field"><option value="all">Όλα τα πεδία</option>${FIELDS.map((f,i)=>`<option value="${i}">${canon(f.n)}</option>`).join('')}</select></div>
    <div><label>Πόλη</label><select id="al-city">${cityOptionsHtml()}</select></div>
    <div><label>Αναζήτηση (σχολή / ίδρυμα)</label><input id="al-q" placeholder="π.χ. Νοσηλευτ, Στρατιωτ..."></div>`;
  ctl.appendChild(row);host.appendChild(ctl);
  const out=el('div');host.appendChild(out);
  function draw(){
    const fsel=$('#al-field').value, citySel=$('#al-city').value, q=($('#al-q').value||'').trim().toLowerCase();
    let list=allSchoolsList();
    if(fsel!=='all') list=list.filter(s=>s.f===+fsel);
    if(citySel&&citySel!=='all') list=list.filter(s=>s.city===citySel);
    if(q) list=list.filter(s=>(s.d+' '+s.inst+' '+s.type).toLowerCase().includes(q));
    list.sort((a,b)=>(b.b26==null?-1:b.b26)-(a.b26==null?-1:a.b26));
    const cap=list.length>400, show=cap?list.slice(0,400):list;
    const rows=show.map(s=>`<tr><td style="text-align:center">${favBtn(s)}</td><td><b>${esc(s.d)}</b><br><small style="color:var(--muted)">${esc(s.inst)}</small><br><small style="color:var(--blue)">💼 ${esc(careerHint(s.d))}</small></td>
      <td>${esc(s.city)}</td><td><small>${esc(s.type)}</small></td>
      <td style="white-space:nowrap">${s.b26!=null?fmtMoria(s.b26):'—'}</td><td>${deltaHtml(s.b26,s.b25)}</td></tr>`).join('');
    out.innerHTML=`<div class="card"><p class="hint">${list.length} αποτελέσματα${cap?' (εμφανίζονται 400 — στένεψε την αναζήτηση)':''} · πάτησε ☆ για αγαπημένα (φαίνονται στην Αρχική)</p>
      <div class="scrollx" style="max-height:70vh;overflow:auto">
      <table><thead><tr><th>★</th><th>Σχολή / Ίδρυμα</th><th>Πόλη</th><th>Τύπος</th><th>Βάση 2026</th><th>Δ 25→26</th></tr></thead>
      <tbody>${rows||'<tr><td colspan="6">Καμία σχολή.</td></tr>'}</tbody></table></div></div>`;
    wireFav(out);
  }
  $('#al-field').value=defaultField();
  $('#al-field').onchange=draw; $('#al-city').onchange=draw; $('#al-q').oninput=draw; draw();
}

/* --- 4) ΣΥΓΚΡΙΣΗ 2–3 ΣΧΟΛΩΝ --- */
function renderCompare(host){
  host.innerHTML='';
  const L=allSchoolsList();
  if(!window.__cmp) window.__cmp=[];
  const ctl=el('div','card no-print');
  ctl.innerHTML=`<div class="tag">Σύγκριση</div><h3>⚖️ Σύγκρινε 2–3 σχολές δίπλα-δίπλα</h3>
    <p class="hint">Διάλεξε σχολή και πάτησε «Προσθήκη» (έως 3). Δες βάσεις, μεταβολή, πόλη & επαγγέλματα μαζί.</p>`;
  const opts=L.map((s,i)=>`<option value="${i}">${esc(s.d)} — ${esc(s.inst)}${s.city?' ('+esc(s.city)+')':''}${s.b26!=null?' · '+fmtMoria(s.b26):''}</option>`).join('');
  const rowSel=el('div','row');
  rowSel.innerHTML=`<div style="flex:4"><label>Σχολή</label><select id="cmp-sel">${opts}</select></div>
    <div style="flex:0 0 auto;display:flex;align-items:flex-end;gap:8px">
      <button class="btn" id="cmp-add">➕ Προσθήκη</button>
      <button class="btn ghost" id="cmp-clr">🗑️ Καθαρισμός</button></div>`;
  ctl.appendChild(rowSel);host.appendChild(ctl);
  const out=el('div');host.appendChild(out);
  function draw(){
    const items=window.__cmp.map(i=>L[i]).filter(Boolean);
    if(!items.length){out.innerHTML='<div class="card"><p class="hint">Δεν έχεις επιλέξει σχολές ακόμα.</p></div>';return;}
    const anyFeat=items.some(s=>findFeatured(s));
    const attr=(label,fn)=>`<tr><th style="text-align:left;white-space:nowrap;color:var(--muted)">${label}</th>${items.map(s=>`<td>${fn(s)}</td>`).join('')}</tr>`;
    let html=`<div class="card">
      <div class="row no-print" style="justify-content:flex-end;gap:8px;margin-bottom:8px">
        <button class="btn ghost sm" id="cmp-csv" style="flex:0 0 auto">⬇️ CSV</button>
        <button class="btn ghost sm" id="cmp-print" style="flex:0 0 auto">🖨️ Εκτύπωση / PDF</button></div>
      <div class="scrollx"><table><thead><tr><th></th>
      ${items.map((s,i)=>`<th style="min-width:150px">${esc(s.d)}<br><button class="btn ghost sm no-print" data-rm="${i}" style="margin-top:4px">✕ Αφαίρεση</button></th>`).join('')}
      </tr></thead><tbody>
      ${attr('Ίδρυμα',s=>esc(s.inst))}
      ${attr('Πόλη',s=>esc(s.city)||'—')}
      ${attr('Πεδίο',s=>s.f!=null?(s.f+1)+'ο Πεδίο':'—')}
      ${attr('💼 Επαγγέλματα',s=>{const f=findFeatured(s);return f?('<ul style="margin:0;padding-left:16px">'+f.jobs.map(x=>`<li>${esc(x)}</li>`).join('')+'</ul>'):esc(careerHint(s.d));})}
      ${anyFeat?attr('📘 Τι μαθαίνεις',s=>{const f=findFeatured(s);return f?f.courses.map(x=>`<span class="pill">${esc(x)}</span>`).join(''):'—';}):''}
      ${attr('Βάση 2026',s=>s.b26!=null?'<b style="color:var(--red2)">'+fmtMoria(s.b26)+'</b>':'—')}
      ${attr('Βάση 2025',s=>s.b25!=null?fmtMoria(s.b25):'—')}
      ${attr('Μεταβολή 25→26',s=>deltaHtml(s.b26,s.b25))}
      ${attr('📊 Βάσεις 5ετίας',s=>{const f=findFeatured(s);return f?baseChart(f.base):'<span class="hint">δες «Αναλυτικά»</span>';})}
      </tbody></table></div></div>`;
    out.innerHTML=html;
    $$('[data-rm]',out).forEach(b=>b.onclick=()=>{window.__cmp.splice(+b.dataset.rm,1);draw();});
    const pr=$('#cmp-print',out); if(pr) pr.onclick=()=>window.print();
    const cx=$('#cmp-csv',out); if(cx) cx.onclick=()=>schoolsCSV(items,'sygkrisi_sxolon');
  }
  $('#cmp-add').onclick=()=>{const i=+$('#cmp-sel').value;if(window.__cmp.length>=3){alert('Μπορείς να συγκρίνεις έως 3 σχολές.');return;}if(window.__cmp.includes(i))return;window.__cmp.push(i);draw();};
  $('#cmp-clr').onclick=()=>{window.__cmp=[];draw();};
  draw();
}

/* =========================================================================
   VIEW: SYLLABUS (εξεταστέα ύλη ανά έτος)
   ========================================================================= */
function viewSyllabus(c){
  c.appendChild(el('div','notice','📑 Η <b>εξεταστέα ύλη</b> των Πανελλαδικών (Γ΄ Λυκείου) ανά μάθημα. ⚠️ Η επίσημη ύλη <b>ανακοινώνεται κάθε έτος</b> από το Υπουργείο Παιδείας/ΙΕΠ — τα κεφάλαια εδώ είναι της πιο πρόσφατης ύλης· επιβεβαίωσέ τα με τον επίσημο σύνδεσμο κάθε μαθήματος.'));

  // controls
  const ctl=el('div','card no-print');
  ctl.innerHTML=`<div class="tag">Ρυθμίσεις προβολής</div>`;
  const row=el('div','row');
  row.innerHTML=`<div><label>Σχολικό έτος εξετάσεων</label><select id="sy-year">${SYLLABUS_YEARS.map(y=>`<option>${y}</option>`).join('')}</select></div>
    <div><label>Πεδίο / μαθήματα</label><select id="sy-field"><option value="all">Όλα τα μαθήματα</option>${FIELDS.map((f,i)=>`<option value="${i}">${canon(f.n)}</option>`).join('')}</select></div>`;
  ctl.appendChild(row);
  c.appendChild(ctl);

  // Θέματα προηγούμενων ετών
  const pp=el('div','card');
  pp.innerHTML=`<div class="tag">Εξάσκηση</div><h3>📄 Θέματα &amp; Λύσεις Προηγούμενων Ετών</h3>
    <p class="hint" style="margin:.2em 0 .8em">Η καλύτερη προετοιμασία: λύσε θέματα παλαιότερων Πανελλαδικών ανά μάθημα.</p>`;
  const ppg=el('div','grid g2');
  PASTPAPERS.forEach(s=>{
    const cc=el('div');cc.style.cssText='border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg2)';
    cc.innerHTML=`<div style="font-size:1.3rem">${s.ic}</div><b style="display:block;margin:4px 0">${s.t}</b>
      <span class="hint">${s.d}</span><br><a class="btn ghost sm" style="text-decoration:none;display:inline-block;margin-top:8px" href="${s.u}" target="_blank" rel="noopener">Άνοιγμα →</a>`;
    ppg.appendChild(cc);
  });
  pp.appendChild(ppg);
  c.appendChild(pp);

  const host=el('div');c.appendChild(host);

  function render(){
    host.innerHTML='';
    const year=$('#sy-year').value;
    const fsel=$('#sy-field').value;
    // year source note
    const yc=el('div','card');
    yc.innerHTML=`<div class="tag">Επίσημες πηγές — έτος ${esc(year)}</div>
      <p style="margin:.3em 0">Πάντα ελέγχεις την ισχύουσα ύλη από:</p>
      <p><a href="${SYLLABUS_SRC.overview}" target="_blank" rel="noopener">🗂️ Εξεταστέα ύλη πανελλαδικών (klimaka)</a></p>
      <p><a href="${SYLLABUS_SRC.iep}" target="_blank" rel="noopener">🏛️ ΙΕΠ — Ύλη & οδηγίες διδασκαλίας</a> · <a href="${SYLLABUS_SRC.minedu}" target="_blank" rel="noopener">Υπουργείο Παιδείας</a></p>`;
    host.appendChild(yc);
    // which subjects
    let subjects;
    if(fsel==='all') subjects=Object.keys(SYLLABUS);
    else subjects=FIELDS[+fsel].subs.map(canon).filter(s=>SYLLABUS[s]);

function targetSubjects(){
  const p=S.profile; if(!p) return allSubjects().slice(0,6);
  if(p.goal==='pan'&&p.field!=null&&FIELDS[p.field]) return FIELDS[p.field].subs.map(s=>s.replace(/&amp;/g,'&'));
  if(p.goal==='kt'&&p.ktSubjects&&p.ktSubjects.length) return p.ktSubjects;
  // general: subjects of the grade
  if(p.gradeCode){const g=LEVELS.flatMap(l=>l.grades).find(x=>x.code===p.gradeCode);if(g)return g.subjects.map(s=>s.replace(/&amp;/g,'&')).filter(s=>!/Αγωγή|Μουσική|Καλλιτεχνικά|Οικιακή/.test(s));}
  return allSubjects().slice(0,8);
}
/* Μέση επίδοση (%) στα κουίζ για ένα μάθημα του προγράμματος (ή null αν δεν υπάρχουν δεδομένα) */
function masteryFor(subject){
  const b=_norm(subject);
  const rel=(S.quizScores||[]).filter(x=>{const a=_norm(x.subject);return a===b||a.includes(b)||b.includes(a)||a.split(' ')[0]===b.split(' ')[0];});
  if(!rel.length) return null;
  const tot=rel.reduce((s,x)=>s+x.total,0),got=rel.reduce((s,x)=>s+x.score,0);
  return tot?Math.round(got/tot*100):null;
}
/* Βάρος μαθήματος στο πρόγραμμα (περισσότερες ώρες για αδύναμα/χαμηλές επιδόσεις) */
function subjWeight(s,weak){
  let w=2;
  if(weak.includes(s)) w+=1;
  const m=masteryFor(s);
  if(m!=null){ if(m<50)w+=2; else if(m<70)w+=1; else if(m>=85)w-=1; }
  return Math.max(1,w);
}
const DAYNAMES=['Δευτέρα','Τρίτη','Τετάρτη','Πέμπτη','Παρασκευή','Σάββατο','Κυριακή'];
function scheduleMonday(){const t=new Date();t.setHours(0,0,0,0);const off=(t.getDay()+6)%7;t.setDate(t.getDate()-off);return t;}
function dayDate(w,d){const m=scheduleMonday();const dt=new Date(m);dt.setDate(m.getDate()+w*7+d);return dt;}
function sameDay(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();}
function daysUntil(iso){if(!iso)return null;const t=new Date();t.setHours(0,0,0,0);const e=new Date(iso);e.setHours(0,0,0,0);return Math.round((e-t)/(1000*3600*24));}
function todayPlan(){
  if(!S.schedule||!S.schedule.plan) return null;
  const today=new Date();today.setHours(0,0,0,0);
  const sc=S.schedule;
  for(let w=0;w<sc.plan.length;w++)for(let d=0;d<sc.plan[w].days.length;d++){
    if(sameDay(dayDate(w,d),today)) return {w,d,rev:sc.plan[w].rev,sessions:sc.plan[w].days[d].sessions};
  }
  return null;
}
function buildSchedule(){
  const p=S.profile||{};
  const hours=Math.max(1,+p.hoursDay||2);
  const days=Math.max(1,Math.min(7,+p.daysWeek||5));
  const perDay=Math.max(1,Math.round(hours));
  let subs=targetSubjects().slice();
  const weak=(p.weak||[]).map(x=>x.replace(/&amp;/g,'&'));
  let pool=[];
  subs.forEach(s=>{const w=subjWeight(s,weak);for(let i=0;i<w;i++)pool.push(s);});
  if(!pool.length)pool=['Μελέτη'];
  let weeks=8;
  if(p.targetDate){const d=(new Date(p.targetDate)-new Date())/(1000*3600*24);weeks=Math.max(1,Math.min(40,Math.ceil(d/7)));}
  const showWeeks=Math.min(weeks,8);
  const topicIdx={};
  const nextTopic=subj=>{const sy=SYLLABUS[canon(subj)];if(!sy||!sy.units||!sy.units.length)return '';const i=(topicIdx[subj]||0)%sy.units.length;topicIdx[subj]=(topicIdx[subj]||0)+1;return sy.units[i];};
  let pi=0;const plan=[];
  for(let w=0;w<showWeeks;w++){
    const isRev=showWeeks>=3 && w>=showWeeks-1; // τελευταία εβδομάδα = επανάληψη
    const week={label:'Εβδομάδα '+(w+1),rev:isRev,days:[]};
    for(let d=0;d<days;d++){
      const sessions=[];
      for(let s=0;s<perDay;s++){const subj=pool[pi%pool.length];pi++;sessions.push({subject:subj,topic:isRev?'':nextTopic(subj),rev:isRev});}
      week.days.push({sessions});
    }
    plan.push(week);
  }
  return {hours,days,perDay,weeks,plan,goal:p.goalLabel||'Γενική μελέτη',target:p.targetDate||''};
}
function escICS(s){return String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');}
function exportICS(){
  const sc=S.schedule; if(!sc){alert('Φτιάξε πρώτα πρόγραμμα.');return;}
  const p2=n=>String(n).padStart(2,'0');

  const at=(dt,h)=>`${dt.getFullYear()}${p2(dt.getMonth()+1)}${p2(dt.getDate())}T${p2(h)}0000`;
  const startHour=17; let ev=''; const now=stamp(new Date());
  sc.plan.forEach((week,wi)=>week.days.forEach((d,di)=>{
    const dt=dayDate(wi,di);
    d.sessions.forEach((s,si)=>{
      const sh=Math.min(22,startHour+si);
      ev+=`BEGIN:VEVENT\r\nUID:sxoleio-${wi}-${di}-${si}-${Date.now()}${si}@sxoleio360\r\nDTSTAMP:${now}\r\nDTSTART:${at(dt,sh)}\r\nDTEND:${at(dt,sh+1)}\r\n`+
          `SUMMARY:${escICS((s.rev?'🔁 Επανάληψη: ':'📚 ')+s.subject)}\r\nDESCRIPTION:${escICS((s.topic||'Μελέτη')+' — ΣΧΟΛΕΙΟ 360°')}\r\nEND:VEVENT\r\n`;
    });
  }));
  const ics=`BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//SXOLEIO360//EL\r\nCALSCALE:GREGORIAN\r\nX-WR-CALNAME:Πρόγραμμα Διαβάσματος\r\n${ev}END:VCALENDAR\r\n`;
  const a=el('a');a.href=URL.createObjectURL(new Blob([ics],{type:'text/calendar;charset=utf-8'}));a.download='programma_diavasmatos.ics';a.click();toast('Το ημερολόγιο (.ics) κατέβηκε','📅');
}

/* ---- Offline αρχεία χρήστη (IndexedDB) ---- */
function idbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open('sxoleio360-files',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('files'))r.result.createObjectStore('files',{keyPath:'id'});};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function idbAll(){const db=await idbOpen();return new Promise((res,rej)=>{const t=db.transaction('files','readonly').objectStore('files').getAll();t.onsuccess=()=>res(t.result||[]);t.onerror=()=>rej(t.error);});}
async function idbPut(rec){const db=await idbOpen();return new Promise((res,rej)=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').put(rec);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});}
async function idbDel(id){const db=await idbOpen();return new Promise((res,rej)=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').delete(id);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});}
const fmtBytes=n=>n>=1048576?(n/1048576).toFixed(1)+' MB':(n/1024).toFixed(0)+' KB';
function openLocalFile(rec){
  const url=URL.createObjectURL(rec.blob);
  const isPdf=/pdf/i.test(rec.type)||/\.pdf$/i.test(rec.name);
  const isImg=/^image\//i.test(rec.type)||/\.(png|jpe?g|gif|webp|svg)$/i.test(rec.name);
  if(!isPdf&&!isImg){const a=el('a');a.href=url;a.download=rec.name;a.click();setTimeout(()=>URL.revokeObjectURL(url),8000);return;}
  const ov=el('div','overlay');ov.style.padding='0';ov.style.zIndex='60';
  const box=el('div');box.style.cssText='width:100%;height:100%;display:flex;flex-direction:column';
  const bar=el('div');bar.style.cssText='display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line)';
  bar.innerHTML=`<b style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">📄 ${esc(rec.name)}</b>`;
  const grp=el('div','row');grp.style.cssText='flex:0 0 auto;gap:8px';
  const dl=el('button','btn ghost sm','⬇️ Λήψη');dl.onclick=()=>{const a=el('a');a.href=url;a.download=rec.name;a.click();};
  const cls=el('button','btn sm','✕ Κλείσιμο');cls.onclick=()=>{ov.remove();URL.revokeObjectURL(url);};
  grp.appendChild(dl);grp.appendChild(cls);bar.appendChild(grp);box.appendChild(bar);
  const body=el('div');body.style.cssText='flex:1;background:#525659;overflow:auto';
  if(isImg)body.innerHTML=`<div style="min-height:100%;display:flex;align-items:center;justify-content:center;padding:10px"><img src="${url}" style="max-width:100%;height:auto"></div>`;
  else body.innerHTML=`<iframe src="${url}" style="width:100%;height:100%;border:0" title="${esc(rec.name)}"></iframe>`;
  box.appendChild(body);ov.appendChild(box);document.body.appendChild(ov);
}

function startQuiz(subject,n,host){
  const bank=(QBANK[subject]||[]).slice();
  // shuffle
  for(let i=bank.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[bank[i],bank[j]]=[bank[j],bank[i]];}
  const qs=bank.slice(0,Math.min(n,bank.length));
  quizState={subject,qs,answers:new Array(qs.length).fill(null),submitted:false};
  renderQuiz(host);
}

    sub.onclick=()=>{

      const score=mc.reduce((a,q,i)=>{const idx=qs.indexOf(q);return a+(answers[idx]===q.a?1:0);},0);
      quizState.autoScore=score;quizState.autoTotal=mc.length;
      if(mc.length){S.quizScores.push({subject,score,total:mc.length,date:new Date().toLocaleDateString('el-GR')});
        if(score===mc.length){confetti();toast('Τέλειο! 100% 🎯','🎉');} else if(score/mc.length>=0.7){toast('Μπράβο! '+score+'/'+mc.length,'👏');}}
      // καταγραφή/αφαίρεση λαθών ανά μάθημα
      if(!S.wrong)S.wrong={};
      qs.forEach((q,i)=>{
        if(q.type!=='mc')return;
        if(answers[i]!==q.a){ S.wrong[subject]=S.wrong[subject]||[]; if(!S.wrong[subject].some(w=>w.q===q.q)) S.wrong[subject].push(q); }
        else if(S.wrong[subject]){ S.wrong[subject]=S.wrong[subject].filter(w=>w.q!==q.q); }
      });
      if(S.wrong[subject]&&!S.wrong[subject].length) delete S.wrong[subject];

    }else res.innerHTML=`<h3>Ολοκληρώθηκε ✓</h3><p class="hint">Έλεγξε τις ενδεικτικές απαντήσεις.</p>`;

/* ---------- FLASHCARDS ---------- */
function deckFor(subject){
  const base=(FLASHCARDS[subject]||[]).slice();
  const custom=(S.customCards||[]).filter(c=>c.subject===subject).map(c=>({front:c.front,back:c.back,custom:true}));
  return base.concat(custom);
}
/* ---- Spaced repetition (SM-2 lite) ---- */
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; // τοπική ημερομηνία (όχι UTC)
const todayISO=()=>ymd(new Date());
const srKey=(subject,front)=>subject+'|'+front;
function srDue(subject,front){const st=S.cardSR&&S.cardSR[srKey(subject,front)];if(!st)return true;return st.due<=todayISO();}
function srSchedule(subject,front,rating){
  if(!S.cardSR)S.cardSR={};
  const k=srKey(subject,front); const st=S.cardSR[k]||{reps:0,interval:0,ease:2.5};
  if(rating==='again'){st.reps=0;st.interval=0;st.ease=Math.max(1.3,st.ease-0.2);}
  else if(rating==='hard'){st.reps++;st.interval=Math.max(1,Math.round((st.interval||1)*1.2));st.ease=Math.max(1.3,st.ease-0.05);}
  else{st.reps++;st.interval=st.reps===1?1:st.reps===2?3:Math.round((st.interval||3)*st.ease);st.ease=Math.min(2.8,st.ease+0.1);}
  const d=new Date();d.setDate(d.getDate()+(rating==='again'?0:st.interval));st.due=ymd(d);
  S.cardSR[k]=st;
  if(!S.stats)S.stats={lastActive:'',streak:0,cardsReviewed:0};S.stats.cardsReviewed=(S.stats.cardsReviewed||0)+1;
  save();touchActivity();
}
function allCards(){
  const subs=[...new Set([...Object.keys(FLASHCARDS),...(S.customCards||[]).map(c=>c.subject)])];
  const out=[];subs.forEach(s=>deckFor(s).forEach(c=>out.push({subject:s,front:c.front,back:c.back})));return out;
}
function dueCount(){return allCards().filter(c=>srDue(c.subject,c.front)).length;}
/* ---- Στατιστικά, σερί & επιτεύγματα ---- */
function touchActivity(){
  if(!S.stats)S.stats={lastActive:'',streak:0,cardsReviewed:0};
  const t=todayISO();
  if(S.stats.lastActive!==t){
    const y=new Date();y.setDate(y.getDate()-1);
    S.stats.streak=(S.stats.lastActive===ymd(y))?((S.stats.streak||0)+1):1;
    S.stats.lastActive=t;save();
  }
}
function computeStats(){
  const qs=S.quizScores||[];const tot=qs.reduce((a,x)=>a+x.total,0),got=qs.reduce((a,x)=>a+x.score,0);
  return {sessions:Object.values(S.done||{}).filter(Boolean).length,quizzes:qs.length,avgQuiz:tot?Math.round(got/tot*100):0,
    bestQuiz:qs.reduce((m,x)=>Math.max(m,Math.round(x.score/x.total*100)),0),cardsReviewed:(S.stats&&S.stats.cardsReviewed)||0,
    pomodoros:S.pomodoros||0,favorites:(S.favorites||[]).length,notesCount:Object.values(S.notes||{}).filter(v=>v&&v.trim()).length,streak:(S.stats&&S.stats.streak)||0};
}

/* =========================================================================
   VIEW: WHITEBOARD
   ========================================================================= */
function viewBoard(c){
  c.appendChild(el('div','notice','🖊️ Διαδραστικός πίνακας για να λύνεις ασκήσεις. Ζωγράφισε με ποντίκι ή δάχτυλο. Μπορείς να αποθηκεύσεις εικόνα ή να εκτυπώσεις.'));
  const card=el('div','card');
  const tools=el('div','tools no-print');
  card.appendChild(tools);
  const wrap=el('div');wrap.id='board-wrap';
  const cv=el('canvas');cv.id='board';wrap.appendChild(cv);
  card.appendChild(wrap);
  c.appendChild(card);

  // build tools
  const colors=['#111111','#e11d2a','#1e63d6','#e8b74a','#8a2be2','#ffffff'];
  let color=colors[0],size=3,erasing=false;
  const swWrap=el('div');swWrap.style.display='flex';swWrap.style.gap='6px';
  colors.forEach((cl,i)=>{const s=el('span','swatch'+(i===0?' on':''));s.style.background=cl;if(cl==='#ffffff')s.style.borderColor='#999';s.onclick=()=>{color=cl;erasing=false;$$('.swatch',swWrap).forEach(x=>x.classList.remove('on'));s.classList.add('on');pen.className='btn ghost sm';};swWrap.appendChild(s);});
  tools.appendChild(swWrap);
  const sizeSel=el('select');sizeSel.style.maxWidth='120px';sizeSel.innerHTML='<option value="2">Λεπτό</option><option value="3" selected>Κανονικό</option><option value="6">Χοντρό</option><option value="12">Μαρκαδόρος</option>';sizeSel.onchange=()=>size=+sizeSel.value;tools.appendChild(sizeSel);
  const pen=el('button','btn sm','✏️ Στυλό');pen.onclick=()=>{erasing=false;pen.className='btn sm';er.className='btn ghost sm';};tools.appendChild(pen);
  const er=el('button','btn ghost sm','🧽 Σβήστρα');er.onclick=()=>{erasing=true;er.className='btn sm';pen.className='btn ghost sm';};tools.appendChild(er);
  const clr=el('button','btn ghost sm','🗑️ Καθαρισμός');tools.appendChild(clr);
  const grid=el('button','btn ghost sm','🔳 Κάνναβος');tools.appendChild(grid);
  const dl=el('button','btn ghost sm','💾 Αποθήκευση PNG');tools.appendChild(dl);
  const prt=el('button','btn ghost sm','🖨️ Εκτύπωση');prt.onclick=()=>window.print();tools.appendChild(prt);

  const ctx=cv.getContext('2d');
  let showGrid=false;
  function resize(){
    const w=wrap.clientWidth, h=Math.round(w*0.6);
    const img=ctx.getImageData?null:null;
    const data=cv.toDataURL();
    cv.width=w;cv.height=h;
    ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);
    if(showGrid)drawGrid();
    const im=new Image();im.onload=()=>ctx.drawImage(im,0,0);im.src=data;
  }
  function drawGrid(){
    ctx.save();ctx.strokeStyle='#e3e6ee';ctx.lineWidth=1;
    for(let x=0;x<cv.width;x+=25){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,cv.height);ctx.stroke();}
    for(let y=0;y<cv.height;y+=25){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(cv.width,y);ctx.stroke();}
    ctx.restore();
  }
  // init size
  cv.width=wrap.clientWidth||800;cv.height=Math.round((wrap.clientWidth||800)*0.6);
  ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);
  window.addEventListener('resize',()=>{clearTimeout(window._brz);window._brz=setTimeout(resize,200);});

  // Pointer Events: υποστηρίζει ποντίκι, δάχτυλο ΚΑΙ ενεργή πένα με ευαισθησία πίεσης
  let drawing=false,last=null;
  const pos=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*(cv.width/r.width),y:(e.clientY-r.top)*(cv.height/r.height)};};
  // πλάτος γραμμής ανάλογα με την πίεση της πένας (0..1)· ποντίκι/δάχτυλο -> σταθερό
  const lineW=e=>{
    if(erasing) return 18;
    const pen=e.pointerType==='pen';
    const pr=(pen && e.pressure>0)?e.pressure:0.5;   // 0.5 = ουδέτερο όταν δεν υπάρχει πίεση
    return pen ? Math.max(0.5, size*(0.35+pr*1.3)) : size;
  };
  function down(e){drawing=true;last=pos(e);try{cv.setPointerCapture(e.pointerId);}catch(_){ } // ζωγράφισε μια τελεία
    ctx.fillStyle=erasing?'#fff':color;ctx.beginPath();ctx.arc(last.x,last.y,lineW(e)/2,0,7);ctx.fill();e.preventDefault();}
  function move(e){if(!drawing)return;
    // coalesced events για πιο ομαλή γραμμή με πένα/γρήγορη κίνηση
    const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
    ctx.strokeStyle=erasing?'#fff':color;ctx.lineCap='round';ctx.lineJoin='round';
    for(const ev of evs){const p=pos(ev);ctx.lineWidth=lineW(ev);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;}
    e.preventDefault();}
  function up(){drawing=false;}
  if(window.PointerEvent){
    cv.addEventListener('pointerdown',down);
    cv.addEventListener('pointermove',move);
    cv.addEventListener('pointerup',up);
    cv.addEventListener('pointercancel',up);
    cv.addEventListener('pointerleave',up);
  }else{ // fallback (πολύ παλιοί browsers)
    const mp=e=>({clientX:(e.touches?e.touches[0]:e).clientX,clientY:(e.touches?e.touches[0]:e).clientY,pointerType:'mouse',pressure:0,preventDefault:()=>e.preventDefault&&e.preventDefault()});
    cv.addEventListener('mousedown',e=>down(mp(e)));cv.addEventListener('mousemove',e=>move(mp(e)));window.addEventListener('mouseup',up);
    cv.addEventListener('touchstart',e=>down(mp(e)),{passive:false});cv.addEventListener('touchmove',e=>move(mp(e)),{passive:false});cv.addEventListener('touchend',up);
  }

  clr.onclick=()=>{ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);if(showGrid)drawGrid();};
  grid.onclick=()=>{showGrid=!showGrid;grid.className=showGrid?'btn sm':'btn ghost sm';if(showGrid)drawGrid();else{const d=cv.toDataURL();ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);}};
  dl.onclick=()=>{const a=el('a');a.download='pinakas.png';a.href=cv.toDataURL('image/png');a.click();};
}

function viewPomodoro(c){
  c.appendChild(el('div','notice no-print','🍅 Τεχνική Pomodoro: μελέτη με εστίαση σε συνεδρίες + μικρά διαλείμματα. Βοηθά τη συγκέντρωση. (Το χρονόμετρο σταματά αν αλλάξεις καρτέλα.)'));
  if(window.__pomoRemain==null){window.__pomoWork=25;window.__pomoBreak=5;window.__pomoMode='work';window.__pomoRemain=25*60;}
  const card=el('div','card');card.style.textAlign='center';
  card.innerHTML=`<div class="tag">${window.__pomoMode==='work'?'🍅 Μελέτη':'☕ Διάλειμμα'}</div>`;
  const disp=el('div');disp.id='pomo-disp';disp.style.cssText='font-size:4rem;font-weight:800;color:var(--red2);letter-spacing:2px;margin:10px 0';
  card.appendChild(disp);
  const bar=el('div','row no-print');bar.style.justifyContent='center';
  const startB=el('button','btn','▶️ Έναρξη');const pauseB=el('button','btn ghost','⏸️ Παύση');const resetB=el('button','btn ghost','↺ Μηδενισμός');
  bar.appendChild(startB);bar.appendChild(pauseB);bar.appendChild(resetB);card.appendChild(bar);
  const presets=el('div','row no-print');presets.style.justifyContent='center';presets.style.marginTop='8px';
  [[25,5],[50,10],[15,3]].forEach(([w,b])=>{const pb=el('button','btn ghost sm',`${w}′ / ${b}′`);pb.onclick=()=>{if(window.__pomoInt){clearInterval(window.__pomoInt);window.__pomoInt=null;}window.__pomoRunning=false;window.__pomoWork=w;window.__pomoBreak=b;window.__pomoMode='work';window.__pomoRemain=w*60;render();updInfo();};presets.appendChild(pb);});
  card.appendChild(presets);
  const info=el('div','hint');info.id='pomo-info';info.style.marginTop='10px';
  card.appendChild(info);
  c.appendChild(card);
  const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
  const updInfo=()=>{info.innerHTML=`Ολοκληρωμένες συνεδρίες μελέτης: <b>${S.pomodoros||0}</b> · Ρύθμιση: ${window.__pomoWork}′ μελέτη / ${window.__pomoBreak}′ διάλειμμα`;};
  function render(){disp.textContent=fmt(window.__pomoRemain);const t=card.querySelector('.tag');if(t)t.textContent=window.__pomoMode==='work'?'🍅 Μελέτη':'☕ Διάλειμμα';}
  function beep(){try{const ac=new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.frequency.value=880;g.gain.value=0.12;o.start();setTimeout(()=>{o.stop();ac.close();},400);}catch(e){}}
  function tick(){
    window.__pomoRemain--;
    if(window.__pomoRemain<=0){
      beep();
      if(window.__pomoInt){clearInterval(window.__pomoInt);window.__pomoInt=null;}window.__pomoRunning=false;
      if(window.__pomoMode==='work'){S.pomodoros=(S.pomodoros||0)+1;save();touchActivity();window.__pomoMode='break';window.__pomoRemain=window.__pomoBreak*60;}
      else{window.__pomoMode='work';window.__pomoRemain=window.__pomoWork*60;}
      updInfo();
    }
    render();
  }
  startB.onclick=()=>{if(window.__pomoRunning)return;window.__pomoRunning=true;window.__pomoInt=setInterval(tick,1000);};
  pauseB.onclick=()=>{if(window.__pomoInt){clearInterval(window.__pomoInt);window.__pomoInt=null;}window.__pomoRunning=false;};
  resetB.onclick=()=>{if(window.__pomoInt){clearInterval(window.__pomoInt);window.__pomoInt=null;}window.__pomoRunning=false;window.__pomoMode='work';window.__pomoRemain=window.__pomoWork*60;render();};
  render();updInfo();
}

    <label>Είσαι...</label>`;
    const chips=el('div','chips');
    [['student','🎒 Μαθητής/τρια'],['adult','👨‍🎓 Ενήλικας που ξαναδίνει'],['transfer','🔁 Φοιτητής/πτυχιούχος (κατατακτήριες)']].forEach(([v,l])=>{
      const ch=el('div','chip'+(obData.type===v?' on':''),l);ch.onclick=()=>{obData.type=v;renderOb();};chips.appendChild(ch);
    });
    body.appendChild(chips);
    $('#ob-name').oninput=e=>obData.name=e.target.value;
  }
  else if(obStep===1){
    body.innerHTML=`<h2>Επίπεδο & τάξη</h2><p class="hint">Διάλεξε την τάξη σου (ή την πιο σχετική).</p>`;
    const chips=el('div','chips');
    LEVELS.forEach(l=>l.grades.forEach(g=>{
      const ch=el('div','chip'+(obData.gradeCode===g.code?' on':''),g.g);
      ch.onclick=()=>{obData.gradeCode=g.code;obData.gradeLabel=g.g;renderOb();};chips.appendChild(ch);
    }));
    const cha=el('div','chip'+(obData.gradeCode==='none'?' on':''),'📗 Εκτός σχολείου / γενική μελέτη');
    cha.onclick=()=>{obData.gradeCode='none';obData.gradeLabel='Γενική μελέτη';renderOb();};chips.appendChild(cha);
    body.appendChild(chips);
  }
  else if(obStep===2){
    body.innerHTML=`<h2>Ποιος είναι ο στόχος σου;</h2>`;
    const chips=el('div','chips');
    [['pan','🎓 Πανελλήνιες'],['kt','🔁 Κατατακτήριες'],['school','📚 Καλύτεροι βαθμοί στο σχολείο'],['general','✨ Γενική γνώση/μελέτη']].forEach(([v,l])=>{
      const ch=el('div','chip'+(obData.goal===v?' on':''),l);ch.onclick=()=>{obData.goal=v;renderOb();};chips.appendChild(ch);
    });
    body.appendChild(chips);
    if(obData.goal==='pan'){
      const d=el('div');d.innerHTML='<label>Επιστημονικό πεδίο</label>';
      const sel=el('select');sel.innerHTML='<option value="">— Διάλεξε πεδίο —</option>'+FIELDS.map((f,i)=>`<option value="${i}" ${obData.field==i?'selected':''}>${f.n.replace(/&amp;/g,'&')}</option>`).join('');
      sel.onchange=()=>obData.field=sel.value===''?null:+sel.value;d.appendChild(sel);body.appendChild(d);
    }
    const dt=el('div');dt.innerHTML=`<label>Ημερομηνία εξετάσεων/στόχος (προαιρετικά)</label><input type="date" id="ob-date" value="${esc(obData.targetDate||'')}">`;
    body.appendChild(dt);$('#ob-date').onchange=e=>obData.targetDate=e.target.value;
  }
  else if(obStep===3){
    body.innerHTML=`<h2>Διαθέσιμος χρόνος & μαθήματα</h2>`;
    const r=el('div','row');
    r.innerHTML=`<div><label>Ώρες μελέτης/ημέρα</label><select id="ob-h">${[1,2,3,4,5,6].map(n=>`<option ${obData.hoursDay==n?'selected':''}>${n}</option>`).join('')}</select></div>
    <div><label>Ημέρες/εβδομάδα</label><select id="ob-d">${[3,4,5,6,7].map(n=>`<option ${obData.daysWeek==n?'selected':''}>${n}</option>`).join('')}</select></div>`;
    body.appendChild(r);
    // subjects to focus based on grade/goal
    let subs;
    if(obData.goal==='pan'&&obData.field!=null&&obData.field!=='')subs=FIELDS[obData.field].subs.map(s=>s.replace(/&amp;/g,'&'));
    else if(obData.gradeCode&&obData.gradeCode!=='none'){const g=LEVELS.flatMap(l=>l.grades).find(x=>x.code===obData.gradeCode);subs=g?g.subjects.map(s=>s.replace(/&amp;/g,'&')):allSubjects();}
    else subs=allSubjects();
    body.appendChild(el('label',null,'💪 Δυνατά μαθήματα (πάτησε για επιλογή)'));
    const c1=el('div','chips');subs.forEach(s=>{const ch=el('div','chip'+(obData.strong.includes(s)?' on':''),s);ch.onclick=()=>{toggle(obData.strong,s);renderOb();};c1.appendChild(ch);});body.appendChild(c1);
    body.appendChild(el('label',null,'🎯 Αδύναμα μαθήματα (θα διαβάζεις περισσότερο)'));
    const c2=el('div','chips');subs.forEach(s=>{const ch=el('div','chip'+(obData.weak.includes(s)?' on':''),s);ch.onclick=()=>{toggle(obData.weak,s);renderOb();};c2.appendChild(ch);});body.appendChild(c2);
    $('#ob-h').onchange=e=>obData.hoursDay=+e.target.value;$('#ob-d').onchange=e=>obData.daysWeek=+e.target.value;
    obData.hoursDay=obData.hoursDay||+$('#ob-h').value;obData.daysWeek=obData.daysWeek||+$('#ob-d').value;
  }
}
function toggle(arr,v){const i=arr.indexOf(v);if(i<0)arr.push(v);else arr.splice(i,1);}
$('#ob-back').onclick=()=>{if(obStep>0)obStep--;renderOb();};
$('#ob-next').onclick=()=>{
  if(obStep===0&&!obData.type)return alert('Διάλεξε τι είσαι.');
  if(obStep<OB_STEPS-1){obStep++;renderOb();return;}
  // finalize
  const TYPEL={student:'Μαθητής/τρια',adult:'Ενήλικας που ξαναδίνει',transfer:'Φοιτητής/Κατατακτήριες'};
  const GOALL={pan:'Πανελλήνιες',kt:'Κατατακτήριες',school:'Σχολικοί βαθμοί',general:'Γενική μελέτη'};
  obData.typeLabel=TYPEL[obData.type]||'';
  obData.hoursDay=obData.hoursDay||2;obData.daysWeek=obData.daysWeek||5;
  if(obData.goal==='pan'&&obData.field!=null&&obData.field!==''){obData.goalLabel='Πανελλήνιες — '+FIELDS[obData.field].n.split('—')[1].trim();}
  else obData.goalLabel=GOALL[obData.goal]||'Γενική μελέτη';
  S.profile=obData;
  S.schedule=buildSchedule();
  save();refreshWho();closeOnboard();go('home');
};

/* =========================================================================
   PWA: service worker + κουμπί εγκατάστασης
   ========================================================================= */
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;const b=document.getElementById('install-btn');if(b)b.style.display='';});
window.addEventListener('appinstalled',()=>{deferredPrompt=null;const b=document.getElementById('install-btn');if(b)b.style.display='none';});
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
async function doInstall(){
  if(!deferredPrompt){alert('Για εγκατάσταση: άνοιξε το από σύνδεσμο http(s)/localhost (όχι με διπλό κλικ στο αρχείο) και χρησιμοποίησε το μενού του browser → «Προσθήκη στην αρχική οθόνη».');return;}
  deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;
}

/* =========================================================================
   INIT
   ========================================================================= */
applyPrefs();
refreshWho();
const _goParam=new URLSearchParams(location.search).get('go');
const _valid=['home','subjects','exams','syllabus','careers','schedule','library','quiz','board','notes','pomodoro','settings'];
go(_goParam&&_valid.includes(_goParam)?_goParam:'home');
if(!S.profile) openOnboard();
</script>
</body>
</html>
